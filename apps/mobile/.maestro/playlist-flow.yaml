# E2E Flow: Playlist UI (create sheet, form inputs, visibility options)
appId: com.canoncore.mobile
name: Playlist Flow
tags:
  - regression
  - playlist
---
# Prerequisites: sign in
- runFlow: subflows/launch-and-sign-in.yaml

# Navigate to Library
- runFlow:
    file: subflows/navigate-tab.yaml
    env:
      TAB: "library"

# Wait for library to load
- extendedWaitUntil:
    visible:
      id: "item-card-0"
    timeout: 10000

# Verify create playlist FAB is visible
- assertVisible:
    id: "create-playlist-button"
- takeScreenshot: screenshots/playlist-library-fab

# Open create playlist sheet via deep link (FAB tap blocked by Maestro iOS bug)
- openLink: "canoncore:///(tabs)/library?create=1"

# Wait for create playlist sheet
- extendedWaitUntil:
    visible:
      id: "playlist-name-input"
    timeout: 5000

# Verify sheet elements
- assertVisible:
    text: "Create Playlist"
- assertVisible:
    id: "playlist-name-input"
- assertVisible:
    id: "create-playlist-confirm"
- takeScreenshot: screenshots/playlist-create-sheet

# Fill in playlist name
- tapOn:
    id: "playlist-name-input"
- inputText: "E2E Test Playlist"
- takeScreenshot: screenshots/playlist-name-filled

# Dismiss create playlist sheet (swipe down — modal tap bug)
- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd

# Verify we're back on library
- extendedWaitUntil:
    visible:
      id: "item-card-0"
    timeout: 5000

# Sign out
- runFlow: subflows/sign-out.yaml
