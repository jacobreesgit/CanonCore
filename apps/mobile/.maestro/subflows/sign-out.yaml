# Subflow: Sign out from any screen
# Uses deep link to navigate to Profile tab

appId: com.canoncore.mobile
---
# Navigate to Profile tab via deep link
- runFlow:
    file: navigate-tab.yaml
    env:
      TAB: "profile"

# Wait for profile screen to load
- extendedWaitUntil:
    visible:
      id: "sign-out-button"
    timeout: 5000

# Tap sign out
- tapOn:
    id: "sign-out-button"

# Confirm sign out if there's a confirmation dialog
- runFlow:
    when:
      visible: "Are you sure"
    commands:
      - tapOn: "Confirm"

# Verify we're back on the sign-in screen
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
