# E2E Flow: Download management (download button, downloads screen)
appId: com.canoncore.mobile
name: Download Flow
tags:
  - regression
  - download
---
# Prerequisites: sign in
- runFlow: subflows/launch-and-sign-in.yaml

# Navigate to Library
- runFlow:
    file: subflows/navigate-tab.yaml
    env:
      TAB: "library"

# Wait for grid to load
- extendedWaitUntil:
    visible:
      id: "item-card-0"
    timeout: 10000

# Open an item with files
- tapOn:
    id: "item-card-0"

# Wait for item detail
- extendedWaitUntil:
    visible:
      id: "item-detail-screen"
    timeout: 10000

# Verify download button is visible (testID covers both "none" and "failed" states)
- assertVisible:
    id: "download-button"
- takeScreenshot: screenshots/download-button-visible

# Tap download button to attempt download
- tapOn:
    id: "download-button"
- waitForAnimationToEnd
- takeScreenshot: screenshots/download-after-tap

# Navigate to Profile > Downloads
- runFlow:
    file: subflows/navigate-tab.yaml
    env:
      TAB: "profile"

# Tap Downloads link
- tapOn:
    id: "profile-downloads-link"

# Verify downloads screen loads
- extendedWaitUntil:
    visible:
      id: "downloads-list"
    timeout: 10000
- takeScreenshot: screenshots/download-downloads-screen

# Go back to profile
- pressKey: back
- waitForAnimationToEnd

# Sign out
- runFlow: subflows/sign-out.yaml
