# E2E Flow: Browse content (home, library, explore, search)
appId: com.canoncore.mobile
name: Browse Flow
tags:
  - smoke
  - browse
---
# Prerequisites: sign in
- runFlow: subflows/launch-and-sign-in.yaml

# --- Home Tab ---
# Verify home screen loaded (sign-in already waited for "Recently Updated")
- assertVisible:
    id: "home-screen"
- assertVisible:
    id: "section-recently-updated"
- takeScreenshot: screenshots/browse-home

# --- Library Tab ---
- runFlow:
    file: subflows/navigate-tab.yaml
    env:
      TAB: "library"
- extendedWaitUntil:
    visible:
      id: "item-card-0"
    timeout: 10000
- takeScreenshot: screenshots/browse-library

# --- Explore Tab ---
- runFlow:
    file: subflows/navigate-tab.yaml
    env:
      TAB: "explore"
- extendedWaitUntil:
    visible:
      id: "explore-tab-items"
    timeout: 10000
- takeScreenshot: screenshots/browse-explore

# --- Search ---
- tapOn:
    id: "search-input"
- inputText: "test"

# Wait for search results grid to populate
- extendedWaitUntil:
    visible:
      id: "search-results"
    timeout: 10000
- takeScreenshot: screenshots/browse-search-results

# Clear search
- tapOn:
    id: "search-clear"

# Sign out
- runFlow: subflows/sign-out.yaml
