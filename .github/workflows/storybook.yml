# Storybook CI workflow
# Builds Storybook and runs smoke/interaction tests on every push and PR

name: Storybook

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Install Playwright browsers
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          for pw in ../../node_modules/.pnpm/playwright-core@*/node_modules/playwright-core; do
            node "$pw/cli.js" install chromium
          done

      - name: Run Storybook tests
        working-directory: apps/web
        run: |
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,cyan" \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && pnpm run test-storybook:ci"

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-static
          path: apps/web/storybook-static/
          retention-days: 7
