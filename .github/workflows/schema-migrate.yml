name: Schema Migration

on:
  push:
    branches: [development, production]
  workflow_dispatch:
    inputs:
      branches:
        description: "Which Neon branches to migrate"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - development
          - production
          - demo
          - seed

concurrency:
  group: schema-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Neon Branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Migrate development
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.branches == 'all' ||
          github.event.inputs.branches == 'development'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy && npx prisma migrate status

      - name: Migrate production
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.branches == 'all' ||
          github.event.inputs.branches == 'production'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy && npx prisma migrate status

      - name: Migrate demo
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.branches == 'all' ||
          github.event.inputs.branches == 'demo'
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: npx prisma migrate deploy && npx prisma migrate status

      - name: Migrate seed
        if: >-
          github.event_name == 'push' ||
          github.event.inputs.branches == 'all' ||
          github.event.inputs.branches == 'seed'
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: npx prisma migrate deploy && npx prisma migrate status
